services:
  backend:
    image: localhost/prototype-autonomous-core_backend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mplads-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - JWT_SECRET_KEY=mplads-sih-autonomous-core-secret-key-2026
      - AUDIT_DB_PATH=/app/storage/audit_store.db
    volumes:
      - mplads_audit_data:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: localhost/prototype-autonomous-core_caddy:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: mplads-caddy
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mplads_audit_data:
    driver: local
