services:
  backend:
    mem_limit: 750m
    mem_reservation: 400m
    memswap_limit: 850m
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 750M
        reservations:
          memory: 400M
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - 8000
      - --reload
      - --reload-dir
      - /app/backend
      - --reload-dir
      - /app/detectors
    environment:
      - DEBUG=true
    volumes:
      - ./backend:/app/backend:ro
      - ./detectors:/app/detectors:ro
      - ./data:/app/data:ro
      - mplads_audit_data:/app/storage

  caddy:
    profiles: ["production"]

  frontend:
    image: localhost/prototype-autonomous-core_vite:latest
    mem_limit: 250m
    mem_reservation: 150m
    memswap_limit: 300m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 250M
        reservations:
          memory: 150M
    build:
      context: .
      dockerfile: docker/Dockerfile.vite
    container_name: mplads-frontend-dev
    working_dir: /app
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
